name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: landing
        run: npm ci

      - name: Lint frontend source
        working-directory: landing
        run: npm run lint

      - name: Build frontend
        working-directory: landing
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: backend
        run: node --check server.js

      - name: Report test-suite status
        run: echo "No automated unit/integration test suite is configured yet. CI runs frontend build/lint and Docker Compose API/database smoke checks instead."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: hustlehub-backend:local
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          file: ./landing/Dockerfile
          tags: hustlehub-frontend:local
          load: true

      - name: Start and smoke-test Compose services
        run: |
          cp .env.example .env
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error http://localhost:8080/
          curl --fail --silent --show-error http://localhost:5000/health | grep -q '"database":"connected"'
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"CI smoke test","email":"ci@example.test","message":"temporary CI record"}' \
            http://localhost:8080/api/users
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:5000/health | grep -q '"database":"connected"'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Backend health check did not recover after restart" >&2
              exit 1
            fi
            sleep 2
          done
          record_count=$(docker compose exec -T mongodb mongosh --quiet hustlehub --eval 'db.users.countDocuments({ email: "ci@example.test" })')
          test "$record_count" = "1"
        if: success()

      - name: Show service logs after failure
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes --remove-orphans